name: iOS PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ios-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-package-publish:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'story/') ||
       startsWith(github.head_ref, 'feat/') ||
       startsWith(github.head_ref, 'refactor/'))
    runs-on: macos-15
    timeout-minutes: 360
    env:
      XCODE_PATH: /Applications/Xcode_26.3.app/Contents/Developer
      CI_ROOT: ${{ github.workspace }}/.ios-preview
      DEPS_BUILD: ${{ github.workspace }}/.ios-preview/deps-build
      DEPS_INSTALL: ${{ github.workspace }}/.ios-preview/deps-install
      DEPS_DOWNLOADS: ${{ github.workspace }}/.ios-preview/downloads
      DEPS_PACKAGES: ${{ github.workspace }}/.ios-preview/packages
      HOST_BUILD: ${{ github.workspace }}/.ios-preview/host-build
      HOST_INSTALL: ${{ github.workspace }}/.ios-preview/host-install
      APP_BUILD: ${{ github.workspace }}/.ios-preview/app-build
      CCACHE_DIR: ${{ github.workspace }}/.ios-preview/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 4G
      RELEASE_DIR: ${{ github.workspace }}/.ios-preview/release
      ASSET_NAME: 3D-Modelling-Thingy-Preview-unsigned.ipa
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out PR source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false

      - name: Hydrate required LFS files from public Blender upstream
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git remote add blender-lfs https://projects.blender.org/blender/blender.git
          git config remote.blender-lfs.lfsurl https://projects.blender.org/blender/blender.git/info/lfs
          git lfs pull blender-lfs \
            --include="assets/**,release/datafiles/**,release/ios/**,scripts/**" \
            --exclude=""
          python3 - <<'PY'
          from pathlib import Path

          roots = (Path("assets"), Path("release/datafiles"), Path("release/ios"), Path("scripts"))
          pointers = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.is_file():
                      with path.open("rb") as handle:
                          if handle.read(42) == b"version https://git-lfs.github.com/spec/v1":
                              pointers.append(str(path))
          if pointers:
              raise SystemExit(f"unhydrated LFS pointer: {pointers[0]}")
          PY

      - name: Select the public runner toolchain
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -downloadComponent MetalToolchain
          metal_toolchain="$(xcodebuild -showComponent MetalToolchain | awk -F': ' '/Toolchain Identifier/ { print $2 }')"
          test -n "$metal_toolchain"
          echo "TOOLCHAINS=$metal_toolchain" >> "$GITHUB_ENV"
          TOOLCHAINS="$metal_toolchain" xcrun --sdk iphoneos metal -v
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Select Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependency build tools
        run: |
          brew install autoconf automake bison ccache dos2unix flex libtool meson ninja pkgconf yasm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Compute content-addressed cache keys
        id: cache-keys
        shell: bash
        run: |
          set -euo pipefail
          xcode_key="$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)"
          dependency_key="$(
            git ls-files \
              build_files/build_environment \
              build_files/ios/build_environment \
              build_files/cmake/config/blender_full.cmake \
              build_files/cmake/config/blender_ios_device.cmake \
              build_files/cmake/config/blender_ios_features.cmake \
              build_files/ios/package_python_frameworks.py \
              | LC_ALL=C sort \
              | xargs shasum -a 256 \
              | shasum -a 256 \
              | cut -d' ' -f1
          )"
          host_key="$(
            git ls-files \
              build_files/cmake/host_tool_features.cmake \
              build_files/cmake/config/blender_full.cmake \
              build_files/cmake/config/blender_ios_host_tools.cmake \
              build_files/cmake/config/blender_ios_features.cmake \
              build_files/ios/bundle_host_tool_runtime.py \
              source/blender/blentranslation/msgfmt \
              source/blender/datatoc \
              source/blender/gpu/shader_tool \
              source/blender/makesdna \
              source/blender/makesrna \
              | LC_ALL=C sort \
              | xargs shasum -a 256 \
              | shasum -a 256 \
              | cut -d' ' -f1
          )"
          library_revision="$(git rev-parse HEAD:lib/macos_arm64)"
          {
            echo "xcode-cache-key=$xcode_key"
            echo "dependency-cache-key=ios-device-deps-v5-${xcode_key}-${dependency_key}"
            echo "host-tool-cache-key=ios-host-tools-v2-${xcode_key}-${library_revision}-${host_key}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore iOS dependency prefix
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.DEPS_INSTALL }}
            ${{ env.DEPS_BUILD }}/Release
          key: ${{ steps.cache-keys.outputs.dependency-cache-key }}

      - name: Restore revision-matched native tools
        id: host-tool-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.HOST_INSTALL }}
          key: ${{ steps.cache-keys.outputs.host-tool-cache-key }}

      - name: Restore full-app compiler cache
        id: app-compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-device-ccache-v1-${{ steps.cache-keys.outputs.xcode-cache-key }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ios-device-ccache-v1-${{ steps.cache-keys.outputs.xcode-cache-key }}-

      - name: Build and harvest iOS dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPS_BUILD" "$DEPS_INSTALL" "$DEPS_DOWNLOADS" "$DEPS_PACKAGES"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          build_python="$(command -v python3.13)"
          cmake \
            -S build_files/ios/build_environment \
            -B "$DEPS_BUILD" \
            -G Ninja \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk_path" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBLENDER_IOS_BUILD_PYTHON="$build_python" \
            -DPACKAGE_USE_UPSTREAM_SOURCES=OFF \
            "-DBLENDER_DEPENDENCY_DOWNLOADS=ZLIB;PNG;JPEG;OPENEXR;OPENSUBDIV;FREETYPE;OPENCOLORIO;MINIZIPNG;OPENIMAGEIO;TIFF;PYTHON;TBB;ZSTANDARD;NUMPY;OPENJPEG;WEBP;YAMLCPP;EXPAT;PUGIXML;BZIP2;FFI;LZMA;SSL;SQLITE;ZSTD;BROTLI;FMT;ROBINMAP;IMATH;PYSTRING;DEFLATE;OPENJPH;EIGEN;OPENAL;BLOSC;ALEMBIC;OIDN;OPENVDB;FFTW;SNDFILE;FLAC;OGG;VORBIS;THEORA;VPX;OPUS;LAME;FFMPEG;GMP;HARU;MANIFOLD;RUBBERBAND;MATERIALX;ABSEIL;CERES;DRACO;MESHOPTIMIZER;POTRACE;EMBREE;OPENPGL;USD" \
            -DDOWNLOAD_DIR="$DEPS_DOWNLOADS" \
            -DPACKAGE_DIR="$DEPS_PACKAGES" \
            -DHARVEST_TARGET="$DEPS_INSTALL" \
            -DMAKE_THREADS=3
          cmake --build "$DEPS_BUILD" --parallel 3 --target \
            external_alembic \
            external_ceres \
            external_draco \
            external_embree \
            external_eigen \
            external_fftw \
            external_ffmpeg \
            external_freetype \
            external_gmp \
            external_haru \
            external_manifold \
            external_materialx \
            external_meshoptimizer \
            external_numpy \
            external_openal \
            external_openimagedenoise \
            external_openimageio \
            external_opensubdiv \
            external_openpgl \
            external_openvdb \
            external_potrace \
            external_rubberband \
            external_sndfile \
            external_tbb \
            external_usd \
            external_zstandard

      - name: Audit cached dependency prefix
        shell: bash
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -f "$DEPS_INSTALL/python/Python.framework/Python" || { echo "::error::Missing cached file: $DEPS_INSTALL/python/Python.framework/Python"; exit 1; }
          test -f "$DEPS_INSTALL/python/lib/python3.13/site-packages/numpy/_core/include/numpy/arrayobject.h" || { echo "::error::Missing cached file: $DEPS_INSTALL/python/lib/python3.13/site-packages/numpy/_core/include/numpy/arrayobject.h"; exit 1; }
          test -f "$DEPS_INSTALL/python/lib/python3.13/site-packages/zstandard/backend_c.cpython-313-iphoneos.so" || { echo "::error::Missing cached file: $DEPS_INSTALL/python/lib/python3.13/site-packages/zstandard/backend_c.cpython-313-iphoneos.so"; exit 1; }
          test -f "$DEPS_INSTALL/openimageio/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake" || { echo "::error::Missing cached file: $DEPS_INSTALL/openimageio/lib/cmake/OpenImageIO/OpenImageIOConfig.cmake"; exit 1; }
          test -f "$DEPS_INSTALL/opencolorio/lib/cmake/OpenColorIO/OpenColorIOConfig.cmake" || { echo "::error::Missing cached file: $DEPS_INSTALL/opencolorio/lib/cmake/OpenColorIO/OpenColorIOConfig.cmake"; exit 1; }
          test -f "$DEPS_INSTALL/opensubdiv/include/opensubdiv/version.h" || { echo "::error::Missing cached file: $DEPS_INSTALL/opensubdiv/include/opensubdiv/version.h"; exit 1; }
          test -f "$DEPS_INSTALL/tbb/lib/cmake/TBB/TBBConfig.cmake" || { echo "::error::Missing cached file: $DEPS_INSTALL/tbb/lib/cmake/TBB/TBBConfig.cmake"; exit 1; }
          test -s "$DEPS_INSTALL/opencolorio/lib/libpystring.a" || { echo "::error::Missing or empty cached file: $DEPS_INSTALL/opencolorio/lib/libpystring.a"; exit 1; }
          test -s "$DEPS_INSTALL/opensubdiv/lib/libosdCPU.a" || { echo "::error::Missing or empty cached file: $DEPS_INSTALL/opensubdiv/lib/libosdCPU.a"; exit 1; }
          test -s "$DEPS_INSTALL/opensubdiv/lib/libosdGPU.a" || { echo "::error::Missing or empty cached file: $DEPS_INSTALL/opensubdiv/lib/libosdGPU.a"; exit 1; }
          test -s "$DEPS_BUILD/Release/png/lib/libpng.a" || { echo "::error::Missing or empty cached file: $DEPS_BUILD/Release/png/lib/libpng.a"; exit 1; }
          test -s "$DEPS_BUILD/Release/zlib/lib/libz.a" || { echo "::error::Missing or empty cached file: $DEPS_BUILD/Release/zlib/lib/libz.a"; exit 1; }
          test -s "$DEPS_BUILD/Release/openimagedenoise/lib/libOpenImageDenoise.a" || { echo "::error::Missing OpenImageDenoise"; exit 1; }
          test -s "$DEPS_BUILD/Release/openvdb/lib/libopenvdb.a" || { echo "::error::Missing OpenVDB"; exit 1; }
          test -s "$DEPS_BUILD/Release/ffmpeg/lib/libavcodec.a" || { echo "::error::Missing FFmpeg"; exit 1; }
          test -s "$DEPS_BUILD/Release/usd/lib/libusd_m.a" || { echo "::error::Missing USD"; exit 1; }
          if [[ "$DEPENDENCY_CACHE_HIT" != "true" ]]; then
            python3 build_files/ios/audit.py abi "$DEPS_BUILD/Release" --target ios-device --arch arm64
          else
            echo "Dependency cache was ABI-audited before it was saved; skipping duplicate scan."
          fi

      - name: Save iOS dependency prefix
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.DEPS_INSTALL }}
            ${{ env.DEPS_BUILD }}/Release
          key: ${{ steps.cache-keys.outputs.dependency-cache-key }}

      - name: Run portable iOS file-access regression tests
        env:
          FMT_INCLUDE_DIR: ${{ env.DEPS_INSTALL }}/fmt/include
        run: |
          python3 -m unittest \
            build_files/ios/tests/test_ghost_file_access.py \
            build_files/ios/tests/test_simulator_file_access.py \
            build_files/ios/tests/test_file_access_runtime.py \
            build_files/ios/tests/test_pr_preview_workflow.py

      - name: Build revision-matched native tools on cache miss
        if: steps.host-tool-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -c submodule.lib/macos_arm64.update=checkout \
            submodule update --init --depth 1 lib/macos_arm64
          test "$(git -C lib/macos_arm64 rev-parse --show-toplevel)" = "$(pwd)/lib/macos_arm64"
          git -C lib/macos_arm64 lfs pull origin
          cmake \
            -S . \
            -B "$HOST_BUILD" \
            -G Ninja \
            -C build_files/cmake/config/blender_ios_host_tools.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build "$HOST_BUILD" --parallel 3 --target \
            makesdna makesrna datatoc msgfmt shader_tool
          mkdir -p "$HOST_INSTALL"
          cp "$HOST_BUILD/bin/makesdna" "$HOST_INSTALL/makesdna"
          cp "$HOST_BUILD/bin/makesrna" "$HOST_INSTALL/makesrna"
          cp "$HOST_BUILD/bin/makesrna.features" "$HOST_INSTALL/makesrna.features"
          cp "$HOST_BUILD/bin/datatoc" "$HOST_INSTALL/datatoc"
          cp "$HOST_BUILD/bin/msgfmt" "$HOST_INSTALL/msgfmt"
          cp "$HOST_BUILD/bin/shader_tool" "$HOST_INSTALL/shader_tool"
          python3 build_files/ios/bundle_host_tool_runtime.py \
            --library-root lib/macos_arm64 \
            --destination "$HOST_INSTALL/lib" \
            "$HOST_INSTALL/makesdna" \
            "$HOST_INSTALL/makesrna" \
            "$HOST_INSTALL/datatoc" \
            "$HOST_INSTALL/msgfmt" \
            "$HOST_INSTALL/shader_tool"

      - name: Audit revision-matched native tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in makesdna makesrna datatoc msgfmt shader_tool; do
            test -x "$HOST_INSTALL/$tool"
          done
          test -f "$HOST_INSTALL/makesrna.features"
          test -n "$(find "$HOST_INSTALL/lib" -maxdepth 1 -type f -name '*.dylib' -print -quit)"
          file "$HOST_INSTALL/makesdna" | grep -q 'arm64'

      - name: Save revision-matched native tools
        if: steps.host-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HOST_INSTALL }}
          key: ${{ steps.cache-keys.outputs.host-tool-cache-key }}

      - name: Configure and build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$HOST_INSTALL/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          build_jobs="$(sysctl -n hw.logicalcpu)"
          ccache --zero-stats
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          cmake \
            -S . \
            -B "$APP_BUILD" \
            -G Ninja \
            -C build_files/cmake/config/blender_ios_device.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk_path" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIOS_HOST_TOOLS_DIR="$HOST_INSTALL" \
            -DLIBDIR="$DEPS_BUILD/Release"
          cmake --build "$APP_BUILD" --parallel "$build_jobs" --target install
          ccache --show-stats
          python3 build_files/ios/audit_build_features.py \
            "$APP_BUILD/bin/Blender.app/Blender" \
            --require-opensubdiv

      - name: Save full-app compiler cache
        if: success() && steps.app-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-device-ccache-v1-${{ steps.cache-keys.outputs.xcode-cache-key }}-${{ github.event.pull_request.head.sha }}

      - name: Package and gate 3D Modelling Thingy IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          ipa="$RELEASE_DIR/$ASSET_NAME"
          python3 build_files/ios/package_sideload_ipa.py \
            "$APP_BUILD/bin/Blender.app" \
            "$ipa" \
            --staging-root "$RELEASE_DIR/staging"
          sha256="$(shasum -a 256 "$ipa" | cut -d' ' -f1)"
          framework_count="$(find "$APP_BUILD/bin/Blender.app/Frameworks" -mindepth 1 -maxdepth 1 -type d -name '*.framework' | wc -l | tr -d ' ')"
          loose_count="$(find "$APP_BUILD/bin/Blender.app" -type f \( -name '*.so' -o -name '*.a' \) | wc -l | tr -d ' ')"
          test "$framework_count" = 74
          test "$loose_count" = 0
          unzip -t "$ipa"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease and comment on the PR
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IPA_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          current_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "$current_sha" != "$PR_SHA" ]]; then
            echo "PR advanced to $current_sha; a newer run will publish its preview."
            exit 0
          fi
          previous_pr="$(
            gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$BASE_REF" \
              --json number --jq '.[0].number'
          )"
          test -n "$previous_pr"
          short_sha="${PR_SHA:0:12}"
          summary="${PR_TITLE#*: }"
          tag="pr-$PR_NUMBER"
          ipa_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$ASSET_NAME"
          install_url="$(IPA_URL="$ipa_url" python3 -c 'import os; from urllib.parse import quote; print("https://marginally-better-apps.github.io/Autoloader/?url=" + quote(os.environ["IPA_URL"], safe=""))')"
          release_body="$RELEASE_DIR/release-body.md"
          comment_body="$RELEASE_DIR/comment-body.md"
          printf '%s\n\n' "Autoloader preview for https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" > "$release_body"
          printf '%s\n\n' "Unsigned universal iPhone+iPad IPA from \`$short_sha\` ($summary, stacked on #$previous_pr). Autoloader signs this on-device." >> "$release_body"
          printf '%s\n' \
            '- App name: 3D Modelling Thingy' \
            '- Bundle identifier: `com.marginallybetterapps.modeling3d.preview`' \
            '- Layout: `Payload/Blender.app`' \
            "- SHA-256: \`$IPA_SHA256\`" \
            '' \
            "Install: $install_url" >> "$release_body"
          printf '%s\n\n' "PR $PR_NUMBER Autoloader/Feather build from \`$short_sha\` ($summary, stacked on #$previous_pr). Hosted on the \`$tag\` GitHub release, not Planista." > "$comment_body"
          printf '%s\n' \
            "- Install (Safari): $install_url" \
            "- Direct IPA: $ipa_url" \
            "- SHA-256: \`$IPA_SHA256\`" \
            '- Identity: 3D Modelling Thingy / `com.marginallybetterapps.modeling3d.preview`' \
            '' \
            'Autoloader signs on-device, then Settings → Installation.' >> "$comment_body"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" "$RELEASE_DIR/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PR_SHA" \
            --title "PR #$PR_NUMBER unsigned IPA" \
            --notes-file "$release_body" \
            --prerelease
          content_type="$(curl --fail --silent --show-error --location --head --output /dev/null --write-out '%{content_type}' "$ipa_url")"
          test "$content_type" = application/octet-stream
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment_body"
