appId: org.blenderfoundation.blender.ios
name: Blender iPad scene lifecycle
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000
# The first-launch gesture guide covers Blender until it is dismissed.
- runFlow:
    when:
      visible:
        id: blender_onboarding
    commands:
      - tapOn:
          id: blender_onboarding_skip
- takeScreenshot: blender-scene-connected
- startRecording: blender-ios-scene-lifecycle
- tapOn:
    point: 50%,61%
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: blender-scene-viewport
- stopRecording
