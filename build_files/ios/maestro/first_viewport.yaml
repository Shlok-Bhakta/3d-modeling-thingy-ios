appId: org.blenderfoundation.blender.ios
name: Blender iOS first interactive viewport
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
# The first-launch gesture guide covers Blender until it is dismissed.
- runFlow:
    when:
      visible:
        id: blender_onboarding
    commands:
      - tapOn:
          id: blender_onboarding_skip
- takeScreenshot: blender-splash
- tapOn:
    point: 10%,50%
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: blender-viewport
